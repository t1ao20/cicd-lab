name: CI

on:
  push:
    branches: [main, feature/a]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: |
          npm run typecheck || {
            {
              echo "### TypeScript typecheck failed"
              echo ""
              echo "How to fix locally:"
              echo '```bash'
              echo "npm run typecheck"
              echo '```'
              echo "Then fix reported TypeScript errors and push again."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: Prettier check
        run: |
          npm run format:check || {
            {
              echo "### Prettier check failed"
              echo ""
              echo "How to fix locally:"
              echo '```bash'
              echo "npm run format"
              echo "npm run format:check"
              echo '```'
              echo "Commit formatting changes and push again."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: Run tests
        run: |
          mkdir -p reports
          npm test

      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always()
        continue-on-error: true
        with:
          name: Vitest Results
          path: reports/junit.xml
          reporter: java-junit