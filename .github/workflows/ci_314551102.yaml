name: CI

on:
  push:
    branches: [main, feature/a]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        if: always()
        run: |
          if npm run typecheck; then
            echo "### ✅ TypeScript typecheck passed" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ❌ TypeScript typecheck failed"
              echo "Run `npm run typecheck` locally, fix the reported errors, then push again."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Prettier check
        if: always()
        run: |
          if npm run format:check; then
            echo "### ✅ Prettier check passed" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ❌ Prettier check failed"
              echo "Run `npm run format` and then `npm run format:check`, commit changes, then push again."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Run tests
        run: |
          mkdir -p reports
          npm test

      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always()
        continue-on-error: true
        with:
          name: Vitest Results
          path: reports/junit.xml
          reporter: java-junit