name: CI_314551102

on:
  push:
    branches: [main, feature/a]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # -------------------------
      # TypeScript Check
      # -------------------------
      - name: TypeScript typecheck
        run: |
          set +e
          TS_OUTPUT=$(NO_COLOR=1 npm run typecheck 2>&1)
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 0 ]; then
            echo "### ✅ TypeScript typecheck passed" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ❌ TypeScript typecheck failed"
              echo ""
              echo "#### Full output:"
              echo '```text'
              echo "$TS_OUTPUT"
              echo '```'
              echo ""
              echo "Run \`npm run typecheck\` locally and fix all errors."
            } >> "$GITHUB_STEP_SUMMARY"

            exit 1
          fi

      # -------------------------
      # Prettier Check
      # -------------------------
      - name: Prettier check
        if: always()
        run: |
          set +e
          FORMAT_OUTPUT=$(npm run format:check 2>&1)
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 0 ]; then
            echo "### ✅ Prettier check passed" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ❌ Prettier check failed"
              echo ""
              echo "#### Full output:"
              echo '```text'
              echo "$FORMAT_OUTPUT"
              echo '```'
              echo ""
              echo "Run \`npm run format\` then commit changes."
            } >> "$GITHUB_STEP_SUMMARY"

            exit 1
          fi

      - name: Run tests
        if: always()
        run: |
          mkdir -p reports
          npm test

      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always()
        continue-on-error: true
        with:
          name: Vitest Results
          path: reports/junit.xml
          reporter: java-junit
